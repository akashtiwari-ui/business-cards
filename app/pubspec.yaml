name: b_card
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_ble_peripheral: ^3.1.0
  flutter_blue_plus: ^2.3.14
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  mobile_scanner: ^7.4.2
  nfc_manager: ^4.2.1
  nfc_manager_ndef: ^1.1.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  screen_brightness: ^2.1.11
  share_plus: ^13.3.1
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  # Bundled so text renders correctly offline on first launch (OFL licences alongside).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700

  assets:
    - assets/images/logo.png
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-PlusJakartaSans.txt
